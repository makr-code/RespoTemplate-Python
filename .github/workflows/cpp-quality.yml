name: cpp-quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format cmake ninja-build
      - name: Configure
        run: cmake --preset debug
      - name: clang-format check
        run: cmake --build --preset build-debug --target clang-format

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cmake ninja-build
      - name: Configure
        run: cmake --preset debug
      - name: Run clang-tidy target
        run: cmake --build --preset build-debug --target clang-tidy

  asan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: Configure ASan
        run: cmake --preset asan
      - name: Build ASan
        run: cmake --build --preset build-asan
      - name: Run tests (ASan)
        run: ctest --preset test-asan --output-on-failure
